# The Homebrew Menu: an app like the others (libwup, LVGL), kept in the menu's flash slot, started by the kernel
name = Homebrew Menu
author = wup-homebrew
version = 1.0.4
description = Apps, Wi-Fi, file sharing and the Netloader
lvgl = yes
net = yes                # (lwIP's threads: sockets and HTTPS for the App Store and Software Update; FTP,
                         #  Developer Mode and the Netloader on its callback API, under its core lock)
system = yes
sources = main.c ui.c config.c sys.c apps.c sound.c clock.c wuplink.c dbgsrv.c ftpd.c wifi/wifi_hw.c wifi/pbkdf2.c bundle.c
thumb_sources = main.c ui.c config.c sys.c apps.c sound.c clock.c wuplink.c dbgsrv.c ftpd.c wifi/wifi_hw.c bundle.c
defines = MENU_VERSION="1.0.4" BUNDLE_OFF=0x2c9000
